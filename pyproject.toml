[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2audiobook"
version = "1.0.0"
description = "Convert documents into narrated MP3, M4A, or WAV audiobooks using online or offline neural voices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "edge-tts==7.2.8",
    "python-docx==1.2.0",
    "pypdf==6.21.2",
]

[project.optional-dependencies]
ui = ["gradio==6.20.0"]
web = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "python-multipart==0.0.32",
]
# Free, fully-offline local providers (Piper + Kokoro):
local = ["piper-tts==1.6.0", "kokoro-onnx==0.4.7", "soundfile==0.14.0"]
openai = ["openai==2.46.0"]       # paid provider (experimental)

[project.scripts]
narrate = "narrate:main"
narrate-ui = "app:main"
narrate-web = "web_api.__main__:main"

[tool.setuptools]
py-modules = ["narrate", "providers", "media_tools", "app"]

[tool.setuptools.packages.find]
include = ["web_api*"]

# The built React client is copied into web_api/frontend by setup.py's build hook
# and shipped as package data so `narrate-web` from a wheel serves the UI (R-012).
[tool.setuptools.package-data]
web_api = ["frontend/**/*"]
