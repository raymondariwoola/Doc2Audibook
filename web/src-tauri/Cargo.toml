[package]
name = "doc2audiobook-desktop"
version = "1.0.0"
description = "Native desktop shell for Doc2Audiobook"
authors = ["Doc2Audiobook contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "doc2audiobook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4"] }
