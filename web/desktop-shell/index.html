<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#222622" />
    <title>Starting Doc2Audiobook…</title>
    <style>
      :root {
        color: #222622;
        background: #f8f7f3;
        font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 32rem;
        padding: 3rem;
        text-align: center;
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        display: grid;
        place-items: center;
        color: white;
        background: #222622;
        box-shadow: 0 1rem 2.5rem rgb(34 38 34 / 18%);
      }
      .mark::after {
        content: "◖◗";
        color: #e7c8bc;
        letter-spacing: -0.3rem;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 1.7rem;
      }
      p {
        color: #686c68;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1 id="startup-title">Starting Doc2Audiobook</h1>
      <p id="startup-message">
        The narration engine is preparing your private local workspace.
      </p>
    </main>
  </body>
</html>
